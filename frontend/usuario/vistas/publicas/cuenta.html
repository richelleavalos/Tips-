<!doctype html>
<!-- Acceso de cliente. Los formularios conservan los selectores consumidos por app.js. -->
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi cuenta | TIPS</title>
<link rel="stylesheet" href="/frontend/usuario/css/public.css?v=6.7.1-20261110"><link rel="stylesheet" href="/frontend/global/css/components.css?v=6.7.1-20261110"><link rel="stylesheet" href="/frontend/global/css/view-transitions.css?v=6.7.1-20261110"><script src="/frontend/global/js/view-transitions.js?v=6.7.1-20261110"></script></head>
<body data-page="account">
<header class="topbar compact"><a class="brand-lockup" href="/index.html"><img class="brand-logo" src="/assets/logos/tips-logo-black.svg" alt="TIPS"><span class="brand-caption">servicios de diseño<br>objetos<br>interiores</span></a><nav class="main-nav desktop-only"><a href="/index.html">Inicio</a><a href="/tienda.html">Tienda</a><a href="/arquitectura.html#proyectos">Portafolio</a><a href="/contacto.html">Contacto</a></nav><a class="btn small ghost" href="/index.html">Volver</a></header>
<main class="auth-editorial-layout">
  <section class="auth-editorial-panel">
    <div class="auth-editorial-inner">
      <p class="eyebrow" data-auth-eyebrow>Bienvenido de nuevo</p>
      <h1 data-auth-heading>Inicia sesión</h1>
      <p class="auth-editorial-lead" data-auth-lead>Accede a tus pedidos y solicitudes de diseño.</p>
      <div class="auth-tabs"><button class="active" aria-pressed="true" data-auth-tab="login">Iniciar sesión</button><button aria-pressed="false" data-auth-tab="register">Crear cuenta</button></div>
      <form data-auth-form="login" class="auth-form">
        <label>Correo electrónico<input type="email" name="email" required autocomplete="email" placeholder="nombre@correo.com"></label>
        <label>Contraseña<input type="password" name="password" required autocomplete="current-password" placeholder="Tu contraseña"></label>
        <div class="auth-inline-note"><label class="editorial-check"><input type="checkbox"> <span>Recordarme</span></label><a href="/recuperar.html">Olvidé mi contraseña</a></div>
        <button class="btn primary wide">Iniciar sesión <span>→</span></button>
        <p class="form-message" data-login-message></p>
      </form>
      <form class="auth-form hidden" data-auth-2fa>
        <p class="eyebrow">Verificación en dos pasos</p>
        <h2>Confirma que eres tú.</h2>
        <label>Código de 6 dígitos<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required placeholder="000000"></label>
        <button class="btn primary wide">Verificar <span>→</span></button>
        <p class="form-message" data-2fa-login-message></p>
      </form>
      <form data-auth-form="register" class="auth-form hidden">
        <label>Nombre completo<input name="display_name" maxlength="120" required placeholder="Tu nombre"></label><label>Prefijo internacional<select name="country_code" data-country-code><option value="+503">+503 — El Salvador</option><option value="+1">+1 — Estados Unidos / Canadá</option><option value="+502">+502 — Guatemala</option><option value="+504">+504 — Honduras</option><option value="+52">+52 — México</option><option value="+34">+34 — España</option><option value="custom">Otro prefijo</option></select></label><label>Teléfono<input name="phone" type="tel" data-phone required autocomplete="tel-national" placeholder="7123-4567"></label>
        <label>Correo electrónico<input type="email" name="email" required autocomplete="email" placeholder="nombre@correo.com"></label>
        <label>Contraseña<input type="password" name="password" minlength="12" required autocomplete="new-password" placeholder="Mínimo 12 caracteres"><small>Usa al menos 12 caracteres.</small></label>
        <label class="editorial-check"><input type="checkbox" required> <span>Acepto los términos de uso y la política de privacidad.</span></label>
        <button class="btn primary wide">Crear cuenta <span>→</span></button><p class="form-message" data-register-message></p>
      </form>
      <div class="account-state hidden" data-account-state><div class="success-icon small">✓</div><h2 data-account-name></h2><p data-account-email></p><div class="actions"><a class="btn primary" href="/user/">Gestionar mi cuenta</a><a class="btn ghost" href="/tienda.html">Ir a la tienda</a><button class="btn ghost" data-logout>Cerrar sesión</button></div></div>
    </div>
  </section>
  <aside class="auth-editorial-visual" aria-hidden="true"></aside>
</main>
<script src="/frontend/global/js/ui-foundation.js?v=6.7.1-20261110" defer></script><script src="/frontend/usuario/js/site-settings.js?v=6.7.1-20261110" defer></script><script src="/frontend/usuario/js/app.js?v=6.7.1-20261110" defer></script><script src="/frontend/global/js/phone.js?v=6.7.1-20261110" defer></script></body></html>
