<body class="security-page"><main class="security-card"><img class="brand" src="/assets/logos/tips-logo-black.svg" alt="TIPS"><p class="eyebrow">Seguridad de cuenta</p><h1>Crea tu contraseña.</h1><p>Esta cuenta usa una contraseña temporal. Para continuar debes reemplazarla por una contraseña personal de al menos 12 caracteres.</p>
<form class="security-form" data-change-password><label>Contraseña temporal<input type="password" name="current_password" required autocomplete="current-password"></label><label>Nueva contraseña<input type="password" name="new_password" minlength="12" required autocomplete="new-password"></label><label>Confirmar nueva contraseña<input type="password" name="confirm_password" minlength="12" required autocomplete="new-password"></label><button type="submit">Guardar y continuar →</button><p class="security-message" data-security-message role="status" aria-live="polite"></p></form>
</main><script src="/frontend/global/js/ui-foundation.js?v=6.7.1-20261110" defer></script><script src="/frontend/global/js/auth-security.js?v=6.7.1-20261110" defer></script><script src="/frontend/global/js/phone.js?v=6.7.1-20261110" defer></script></body></html>
